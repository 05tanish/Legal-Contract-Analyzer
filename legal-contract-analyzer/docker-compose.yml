version: '3.8'

services:
  web:
    build: .
    container_name: legal-contract-analyzer
    ports:
      - "8000:8000"
    volumes:
      # Mount the media directory to persist uploaded files
      - media_volume:/app/media
      # Persist SQLite database (Remove if using PostgreSQL in prod)
      - ./db.sqlite3:/app/db.sqlite3
    environment:
      - DEBUG=False
      # Allow local and production hosts
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      # Provide a secure secret key in production
      - SECRET_KEY=your_secure_production_secret_key_here
      # If using postgres instead of sqlite, specify DATABASE_URL
      # - DATABASE_URL=postgres://user:password@db:5432/dbname
    restart: always

volumes:
  media_volume:
