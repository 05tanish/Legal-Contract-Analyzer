version: '3.9'

# ==============================================================================
# ContractIQ – Enterprise Legal Contract Intelligence Platform
# Production Deployment Orchestration
# ==============================================================================

services:
  # ----------------------------------------------------
  # PostgreSQL (Production Local or Cloud Connection)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: contractiq_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legal_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-legal_analyzer_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal_admin} -d ${POSTGRES_DB:-legal_analyzer_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  # ----------------------------------------------------
  # Backend API Service (FastAPI + LangGraph + Uvicorn)
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contractiq_prod_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - ENVIRONMENT=production
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-4}
    volumes:
      - backend_prod_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  # ----------------------------------------------------
  # Frontend Web UI (Nginx + React SPA Production Build)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contractiq_prod_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_prod_data:
  backend_prod_uploads:

