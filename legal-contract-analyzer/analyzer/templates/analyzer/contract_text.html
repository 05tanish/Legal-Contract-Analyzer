{% extends 'analyzer/base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-12 mb-3">
        <a href="{% url 'contract_detail' contract.id %}" class="text-decoration-none"><i class="fa-solid fa-arrow-left me-2"></i>Back to Analysis</a>
    </div>
</div>

<div class="row">
    <div class="col-md-3">
        <div class="card border-0 shadow-sm sticky-top" style="top: 20px;">
            <div class="card-body">
                <h6 class="text-uppercase text-muted fw-bold mb-3">Select Page</h6>
                <div class="list-group list-group-flush overflow-auto" style="max-height: 70vh;">
                    {% for p in contract.pages.all %}
                        <a href="?page={{ p.page_number }}" class="list-group-item list-group-item-action {% if p.page_number == current_page %}active{% endif %}">
                            Page {{ p.page_number }}
                        </a>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
    <div class="col-md-9">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h5 class="mb-0">Page {{ current_page }} of {{ total_pages }}</h5>
            </div>
            <div class="card-body">
                {% if page %}
                    <div class="bg-light p-4 rounded" style="font-family: monospace; white-space: pre-wrap; font-size: 0.95rem;">{{ page.text }}</div>
                {% else %}
                    <p class="text-muted text-center py-5">Page not found or empty.</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
