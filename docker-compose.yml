version: '3.9'

services:
  # ----------------------------------------------------
  # PostgreSQL: Relational Metadata, Audit History & Users
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: legal_contract_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-legal_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legal_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-legal_analyzer_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legal_admin} -d ${POSTGRES_DB:-legal_analyzer_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Qdrant: High-Performance Vector Database (Dense + Sparse)
  # ----------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal_contract_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep \"200 OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Redis: Asynchronous Task Queue & Semantic Cache
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: legal_contract_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------
  # Backend API: FastAPI Core & LangGraph RAG Service
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal_contract_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-legal_admin}:${POSTGRES_PASSWORD:-legal_secret_pass}@postgres:5432/${POSTGRES_DB:-legal_analyzer_db}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------
  # Celery Worker: Async PDF Ingestion & Embedding Generator
  # ----------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: legal_contract_worker
    restart: unless-stopped
    command: celery -A workers.celery_app.celery worker --loglevel=info --concurrency=2
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-legal_admin}:${POSTGRES_PASSWORD:-legal_secret_pass}@postgres:5432/${POSTGRES_DB:-legal_analyzer_db}
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_storage:
  redis_data:
  backend_uploads:

